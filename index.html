<style>
    body {
        font-family: Helvetica, sans-serif;
        text-align: center;
        background-color: #E6E6FA;
        padding: 60px;
        margin: 0;
    }

    h1,
    h2 {
        color: #800080;
    }

    p {
        color: #333333;
    }

    button {
        background-color: #800080;
        color: white;
        padding: 12px 25px;
        margin: 8px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        animation: blink 1.5s ease-in-out infinite;
    }

    button:hover {
        background-color: #4B0082;
    }

    @keyframes blink {
        0%, 100% {
            opacity: 1;
        }

        50% {
            opacity: 0.45;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        button {
            animation: none;
        }
    }
</style>
