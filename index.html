
<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <style>
    body {
        font-family: Helvetica, sans-serif;
        text-align: center;
        background-color: #E6E6FA;
        padding: 60px;
        margin: 0;
    }

    h1,
    h2 {
        color: #800080;
    }

    p {
        color: #333333;
    }

    button {
        background-color: #800080;
        color: white;
        padding: 12px 25px;
        margin: 8px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        animation: blink 1.5s ease-in-out infinite;
    }

    button:hover {
        background-color: #4B0082;
    }

    @keyframes blink {
        0%, 100% {
            opacity: 1;
        }

        50% {
            opacity: 0.45;
        }
    }
</style>
</head>
<body>

    <h1>Welcome to My Website!</h1>
	<div style="font-size: 80px; text-align: center; margin: 20px 0;">
    😊
</div>
    <p>This is my first website built using GitHub.</p>

	<button onclick="window.open('https://www.facebook.com', 	'_blank')">
    		Facebook
	</button>

	<button onclick="window.open('https://www.instagram.com', 	'_blank')">
	    	Instagram
	</button>

	<button onclick="window.open('https://www.tiktok.com', 	'_blank')">
    		TikTok
	</button>
</body>
</html>
